<style>
:root{--on:#fff;--acc:#e8590c;--sheet:rgba(250,247,243,.82);--sink:#1d1a17;--sline:rgba(0,0,0,.12);--field:rgba(0,0,0,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sheet:rgba(28,24,21,.8);--sink:#f6efe7;--sline:rgba(255,255,255,.16);--field:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--sheet:rgba(28,24,21,.8);--sink:#f6efe7;--sline:rgba(255,255,255,.16);--field:rgba(255,255,255,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#120e0c;color:var(--on);font-family:-apple-system,"SF Pro Display","SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(60% 45% at 18% 12%,#c2562d 0,transparent 70%),radial-gradient(55% 40% at 88% 42%,#6d3a97 0,transparent 70%),radial-gradient(75% 50% at 35% 100%,#1c6a74 0,transparent 70%),#120e0c}
.sl{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.8s ease}
.sl.on{opacity:1}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,0) 30%,rgba(0,0,0,.18) 55%,rgba(0,0,0,.55))}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:10px 18px 16px;max-width:520px;margin:0 auto}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.06)),rgba(20,16,14,.26);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),0 12px 32px rgba(0,0,0,.3)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(255,255,255,.75),rgba(255,255,255,0) 32%,rgba(255,255,255,0) 66%,rgba(255,255,255,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
svg{width:1em;height:1em;display:block}
header{display:flex;justify-content:space-between;align-items:center;position:relative}
.brand{display:flex;align-items:baseline;gap:7px;padding:10px 18px;border-radius:999px;font-weight:650;font-size:.95rem;letter-spacing:-.01em}
.brand span{font-weight:500;opacity:.7}
.icb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--on);cursor:pointer;padding:0}
#menu{position:absolute;right:0;top:54px;border-radius:22px;padding:6px;min-width:236px;z-index:5;display:none}
#menu.open{display:block}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--on);padding:13px 14px;font:inherit;font-size:.95rem;border-radius:16px;cursor:pointer}
#menu button+button{border-top:1px solid rgba(255,255,255,.1);border-radius:0}
#menu button:active{background:rgba(255,255,255,.14)}
#menu .dng{color:#ffa49a}
.stage{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 4px 22px}
#kick{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;opacity:.75;margin:0 0 8px;font-weight:600}
#title{font-size:2rem;line-height:1.1;font-weight:720;letter-spacing:-.025em;margin:0 0 6px;text-shadow:0 2px 18px rgba(0,0,0,.45)}
#sub{font-size:.95rem;opacity:.8;margin:0;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.pill{position:relative;display:flex;align-items:center;gap:10px;border-radius:40px;padding:10px 12px 12px 14px;overflow:hidden}
.ctl{display:flex;flex:1;align-items:center;justify-content:space-around}
.ctl button{background:none;border:0;color:var(--on);width:50px;height:50px;border-radius:50%;font-size:26px;display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s}
.ctl button:active{transform:scale(.9)}
#shuf{position:relative;width:44px;height:44px;font-size:21px;opacity:.55}
#shuf.on{opacity:1;color:#ffb27d}
#shuf.on::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:#ffb27d}
#play{width:58px;height:58px;background:rgba(255,255,255,.94);color:#1d1a17;box-shadow:0 6px 18px rgba(0,0,0,.35);font-size:28px}
#play .pa{display:none}#play[data-s="p"] .pl{display:none}#play[data-s="p"] .pa{display:block}
#disc{width:62px;height:62px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.6);background:conic-gradient(#1c1816,#4a413b,#1c1816,#5a4f48,#1c1816) center/cover;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.4);animation:spin 7s linear infinite;animation-play-state:paused}
#disc.on{animation-play-state:running}
#disc::after{content:"";position:absolute;inset:39%;border-radius:50%;background:#1a1512;border:1px solid rgba(255,255,255,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
.time{display:flex;align-items:center;gap:10px;margin:14px 8px 0;font-size:.75rem;font-variant-numeric:tabular-nums;opacity:.92}
.trk{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.25);position:relative;cursor:pointer}
.trk::before{content:"";position:absolute;inset:-12px 0}
#prog{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:3px}
.next{margin:12px auto 0;max-width:86%;text-align:center;font-size:.82rem;padding:9px 18px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next b{font-weight:650}
#tip{margin:12px auto 0;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;color:var(--on);font:inherit;font-size:.75rem;font-weight:550;cursor:pointer}
#tip svg{font-size:14px}
dialog{border:1px solid var(--sline);border-radius:28px;background:var(--sheet);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);color:var(--sink);width:min(92vw,420px);padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(6px)}
dialog h2{margin:0 0 8px;font-size:1.2rem;letter-spacing:-.02em}
dialog p{font-size:.85rem;opacity:.75;margin:6px 0;line-height:1.45}
textarea{width:100%;background:var(--field);border:1px solid var(--sline);color:var(--sink);border-radius:14px;padding:12px;font-family:ui-monospace,"SF Mono",monospace;font-size:.8rem;min-height:120px;margin:8px 0;resize:vertical}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:11px 18px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
.btn.alt{background:var(--field);color:var(--sink);border:1px solid var(--sline)}
#qr{width:100%;max-width:260px;display:block;margin:12px auto;border-radius:18px;background:#fff;padding:8px}
#qrEmpty{text-align:center;padding:30px 8px;border:1px dashed var(--sline);border-radius:18px;font-size:.9rem;opacity:.75}
input[type=file]{display:none}
[hidden]{display:none!important}
</style>

<style>
  :root{
    --tea-900:#0a1a16;
    --tea-800:#0f2a22;
    --gamosa:#b3432b;
    --gold:#d9a441;
    --glass-bg: rgba(255,255,255,0.07);
    --glass-bg-strong: rgba(255,255,255,0.11);
    --glass-border: rgba(255,255,255,0.16);
    --ink:#f3ede3;
    --ink-dim: rgba(243,237,227,0.62);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
    background: var(--tea-900);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    overflow-x:hidden;
  }

  .field{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(179,67,43,0.35), transparent 55%),
      radial-gradient(ellipse at 82% 78%, rgba(217,164,65,0.28), transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(15,42,34,0.9), transparent 60%),
      linear-gradient(160deg, var(--tea-900), #071310 70%);
  }

  .orb{
    position:fixed;
    border-radius:50%;
    filter: blur(90px);
    z-index:0;
    opacity:0.55;
    animation: drift 26s ease-in-out infinite;
  }
  .orb.a{ width:420px; height:420px; background:var(--gamosa); top:-120px; left:-100px; }
  .orb.b{ width:380px; height:380px; background:var(--gold); bottom:-140px; right:-80px; animation-delay:-9s; }
  .orb.c{ width:300px; height:300px; background:#3f6b5c; top:40%; left:60%; animation-delay:-17s; }

  @keyframes drift{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(30px,-25px) scale(1.08); }
  }

  @media (prefers-reduced-motion: reduce){
    .orb{ animation: none; }
  }

  main{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 48px 20px 64px;
  }

  .eyebrow-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:6px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }

  .sub{
    color:var(--ink-dim);
    font-size:0.98rem;
    max-width:480px;
    text-align:center;
    margin:0 0 36px;
    line-height:1.5;
  }

  .card{
    width:100%;
    max-width:560px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    border-radius:28px;
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);

    padding: 28px;
    margin-bottom:22px;
